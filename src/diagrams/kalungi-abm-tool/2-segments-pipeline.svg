<text class="mut" x="562.0" y="354.0" font-size="12" text-anchor="start">per company</text>
<path class="flow" d="M490,474 L490,498" marker-end="url(#ah)"/>
<text class="mut" x="562.0" y="490.0" font-size="12" text-anchor="start">qualified</text>
<path class="flow" d="M490,610 L490,634" marker-end="url(#ah)"/>
<text class="mut" x="562.0" y="626.0" font-size="12" text-anchor="start">enrich</text>
<path class="flow" d="M640,418 L740,418" marker-end="url(#ah)"/>
<text class="mut" x="690.0" y="409.0" font-size="12" text-anchor="middle">gather + score</text>
<path class="flow" d="M640,554 L740,554" marker-end="url(#ah)"/>
<text class="mut" x="690.0" y="545.0" font-size="12" text-anchor="middle">Sales Nav</text>
<path class="flow" d="M640,690 L740,690" marker-end="url(#ah)"/>
<text class="mut" x="690.0" y="681.0" font-size="12" text-anchor="middle">enrich + sync</text>
<g><rect class="bx abm" x="200" y="828" width="760" height="120" rx="10"/></g>
<text class="t" x="222" y="862" font-size="18" text-anchor="start">PostgreSQL</text>
<text class="mut" x="222" y="886" font-size="13" text-anchor="start">segments · companies · contacts</text>
<text class="mut" x="222" y="906" font-size="13" text-anchor="start">usage / caps (per-account daily limits)</text>
<path class="flow" d="M490,746 L490,828" marker-end="url(#ah)"/>
<text class="mut" x="554.0" y="787.0" font-size="12" text-anchor="start">persist</text>
