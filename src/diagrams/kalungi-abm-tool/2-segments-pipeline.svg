<svg viewBox="-40 -80 1190 1150" role="img" aria-label="ABM Segments pipeline: the orchestrator qualifies each company via LinkedIn, web and news search and an AI verdict, then extracts and enriches contacts and syncs to HubSpot, persisting to PostgreSQL">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.8 L9,5 L0.5,9.2" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="h" x="40" y="44" font-size="22" text-anchor="start">Kalungi ABM Tool: the Segments pipeline (component diagram)</text>
<text class="mut" x="42" y="70" font-size="13.5" text-anchor="start">C4 level 3 · company qualification + contact extraction and enrichment</text>
<g transform="rotate(-0.4 490 146)"><rect class="bx dev" x="340" y="90" width="300" height="112" rx="10"/></g>
<text class="t" x="358" y="121" font-size="19" text-anchor="start">Segment page</text>
<text class="a-dev" x="358" y="142" font-size="13" text-anchor="start">React · authFetch</text>
<text class="mut" x="358" y="162" font-size="12.5" text-anchor="start">add companies, watch status</text>
<g transform="rotate(0.4 490 282)"><rect class="bx pm" x="340" y="226" width="300" height="112" rx="10"/></g>
<text class="t" x="358" y="257" font-size="19" text-anchor="start">Orchestrator</text>
<text class="a-pm" x="358" y="278" font-size="13" text-anchor="start">status machine</text>
<text class="mut" x="358" y="298" font-size="12.5" text-anchor="start">worker semaphore (up to 20)</text>
<text class="mut" x="358" y="314" font-size="12.5" text-anchor="start">pending -> running -> done</text>
<g transform="rotate(-0.4 490 418)"><rect class="bx pm" x="340" y="362" width="300" height="112" rx="10"/></g>
<text class="t" x="358" y="393" font-size="19" text-anchor="start">Company qualifier</text>
<text class="a-pm" x="358" y="414" font-size="13" text-anchor="start">AI verdict + score</text>
<text class="mut" x="358" y="434" font-size="12.5" text-anchor="start">qualified / not / unclear</text>
<text class="mut" x="358" y="450" font-size="12.5" text-anchor="start">+ manual override</text>
<g transform="rotate(0.4 490 554)"><rect class="bx pm" x="340" y="498" width="300" height="112" rx="10"/></g>
<text class="t" x="358" y="529" font-size="19" text-anchor="start">Contact extractor</text>
<text class="a-pm" x="358" y="550" font-size="13" text-anchor="start">Sales Nav lead search</text>
<text class="mut" x="358" y="570" font-size="12.5" text-anchor="start">dedup by stable id</text>
<text class="mut" x="358" y="586" font-size="12.5" text-anchor="start"><=1000-result slices</text>
<g transform="rotate(-0.4 490 690)"><rect class="bx pm" x="340" y="634" width="300" height="112" rx="10"/></g>
<text class="t" x="358" y="665" font-size="19" text-anchor="start">Contact enricher</text>
<text class="a-pm" x="358" y="686" font-size="13" text-anchor="start">title + persona score</text>
<text class="mut" x="358" y="706" font-size="12.5" text-anchor="start">fallback chain</text>
<text class="mut" x="358" y="722" font-size="12.5" text-anchor="start">daily caps per account</text>
<g><rect class="bx ext" x="740" y="362" width="340" height="112" rx="10"/></g>
<text class="t" x="758" y="393" font-size="19" text-anchor="start">Signals + AI</text>
<text class="mut" x="758" y="414" font-size="12.5" text-anchor="start">LinkedIn scrape · Serper web + news</text>
<text class="mut" x="758" y="430" font-size="12.5" text-anchor="start">web scrape -> OpenAI / Claude</text>
<g><rect class="bx ext" x="740" y="498" width="340" height="112" rx="10"/></g>
<text class="t" x="758" y="529" font-size="19" text-anchor="start">LinkedIn Sales Navigator</text>
<text class="mut" x="758" y="550" font-size="12.5" text-anchor="start">lead search API</text>
<text class="mut" x="758" y="566" font-size="12.5" text-anchor="start">identity = stable member id</text>
<g><rect class="bx ext" x="740" y="634" width="340" height="112" rx="10"/></g>
