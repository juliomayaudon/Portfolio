<text class="mut" x="758" y="686" font-size="12.5" text-anchor="start">Apollo -> LinkedIn -> LLM -> photo</text>
<text class="mut" x="758" y="702" font-size="12.5" text-anchor="start">OpenAI persona · HubSpot sync</text>
