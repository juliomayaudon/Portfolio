<svg viewBox="-36 -64 1212 928" role="img" aria-label="Acopio Venezuela inventory ledger component diagram: donation, shipment and consumption forms hit one REST handler that validates quantities, resolves the center by role, then in a single Prisma transaction writes the record and upserts the per-center inventory, incrementing for donations and decrementing for shipments and consumption">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0.5,0.8 L9,5 L0.5,9.2" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="h" x="40" y="40" font-size="21" text-anchor="start">Acopio Venezuela: the inventory ledger (component diagram)</text>
<text class="mut" x="42" y="65" font-size="13" text-anchor="start">C4 level 3 · donations add stock, shipments and consumption remove it, all in one transaction</text>
<g transform="rotate(-0.5 170 187)"><rect class="bx dev" x="40" y="150" width="260" height="74" rx="10"/></g>
<text class="t" x="58" y="180" font-size="17" text-anchor="start">Donation</text>
<text class="a-dev" x="58" y="202" font-size="12.5" text-anchor="start">adds stock (+)</text>
<g transform="rotate(0.4 170 299)"><rect class="bx dev" x="40" y="262" width="260" height="74" rx="10"/></g>
<text class="t" x="58" y="292" font-size="17" text-anchor="start">Shipment</text>
<text class="a-dev" x="58" y="314" font-size="12.5" text-anchor="start">removes stock (-)</text>
<g transform="rotate(-0.4 170 411)"><rect class="bx dev" x="40" y="374" width="260" height="74" rx="10"/></g>
<text class="t" x="58" y="404" font-size="16" text-anchor="start">Internal consumption</text>
<text class="a-dev" x="58" y="426" font-size="12.5" text-anchor="start">removes stock (-)</text>
<g transform="rotate(0.4 580 291)"><rect class="bx pm" x="420" y="236" width="320" height="110" rx="10"/></g>
<text class="t" x="438" y="265" font-size="18" text-anchor="start">REST API handler</text>
<text class="a-pm" x="438" y="285" font-size="12.5" text-anchor="start">POST /donaciones · /envios · /consumos</text>
<text class="mut" x="438" y="304" font-size="12" text-anchor="start">authorize by role</text>
<path class="flow" d="M300,187 L420,262" marker-end="url(#ah)"/>
<path class="flow" d="M300,299 L420,291" marker-end="url(#ah)"/>
<path class="flow" d="M300,411 L420,320" marker-end="url(#ah)"/>
<g transform="rotate(-0.3 580 423)"><rect class="bx pm" x="420" y="392" width="320" height="62" rx="10"/></g>
<text class="t" x="438" y="420" font-size="15.5" text-anchor="start">Validate quantities</text>
<text class="mut" x="438" y="440" font-size="12" text-anchor="start">positive · finite</text>
<g transform="rotate(0.3 580 517)"><rect class="bx pm" x="420" y="486" width="320" height="62" rx="10"/></g>
<text class="t" x="438" y="514" font-size="15.5" text-anchor="start">Resolve center</text>
<text class="mut" x="438" y="534" font-size="12" text-anchor="start">resolveCentroDestino · scoped by role</text>
<g transform="rotate(-0.25 580 655)"><rect class="bx pm" x="400" y="580" width="360" height="150" rx="10"/></g>
<text class="t" x="418" y="610" font-size="17" text-anchor="start">Prisma $transaction</text>
<text class="a-pm" x="418" y="632" font-size="12.5" text-anchor="start">all or nothing</text>
<text class="mut" x="418" y="656" font-size="12" text-anchor="start">1. create record + line items</text>
<text class="mut" x="418" y="674" font-size="12" text-anchor="start">2. Inventario upsert</text>
<text class="mut" x="432" y="692" font-size="11.5" text-anchor="start">+ donation   - shipment   - consumption</text>
<path class="flow" d="M580,346 L580,392" marker-end="url(#ah)"/>
<path class="flow" d="M580,454 L580,486" marker-end="url(#ah)"/>
<path class="flow" d="M580,548 L580,580" marker-end="url(#ah)"/>
<g transform="rotate(-0.5 965 660)"><rect class="bx abm" x="820" y="600" width="290" height="120" rx="10"/></g>
<text class="t" x="838" y="632" font-size="17" text-anchor="start">PostgreSQL</text>
<text class="a-abm" x="838" y="654" font-size="12.5" text-anchor="start">Inventario</text>
<text class="mut" x="838" y="676" font-size="12" text-anchor="start">one row per center + product</text>
<text class="mut" x="838" y="694" font-size="12" text-anchor="start">unique (center, product)</text>
<path class="flow" d="M760,655 L820,660" marker-end="url(#ah)"/>
<text class="mut" x="790.0" y="645" font-size="12" text-anchor="middle">upsert</text>
</svg>