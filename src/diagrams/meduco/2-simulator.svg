<text class="mut" x="42" y="70" font-size="14" text-anchor="start">C4 level 3 · inside the PHP API's SimulatorController + the academia UI</text>
<g transform="rotate(-0.4 560 162)"><rect class="bx dev" x="430" y="110" width="260" height="104" rx="10"/></g>
<text class="t" x="448" y="142" font-size="20" text-anchor="start">Simulador.jsx</text>
