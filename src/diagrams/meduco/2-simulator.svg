<svg viewBox="-60 -140 1420 1270" role="img" aria-label="Meduco simulator component diagram: the academia UI drives a vertical pipeline (access guard, session engine, answer grader, SM-2, analytics) inside the PHP API; question bank and daily challenge are feeder services; all persist to the sim_ tables in MySQL">
